name: Agent security branch format

on:
  push:
    branches:
      - agent/p1-database-security
    paths:
      - tools/agent_security_format.trigger

permissions:
  contents: write

jobs:
  format-and-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Resolve dependencies and format
        run: |
          flutter pub get
          dart format lib test
      - name: Commit canonical files to current branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib test pubspec.lock
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Format P1 security changes and refresh lockfile"
          git push origin "HEAD:${GITHUB_REF_NAME}"
