name: Diagnose Flutter analyze

on:
  push:
    paths:
      - tools/analyze.trigger

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Generate Drift code
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Capture analyzer output
        shell: bash
        run: |
          set +e
          flutter analyze 2>&1 | tee analyze.log
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" > tools/analyze_output.txt
          cat analyze.log >> tools/analyze_output.txt
          exit 0
      - name: Commit analyzer diagnostic
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/analyze_output.txt
          git commit -m "diagnostic: capture flutter analyze output" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
