name: Signed release packaging

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Target platform
        required: true
        type: choice
        options: [android, macos, ios]

permissions:
  contents: read

jobs:
  android:
    if: inputs.platform == 'android'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Restore Android signing key
        env:
          KEYSTORE_B64: ${{ secrets.NOT_ANDROID_KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE_B64"
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/not-release.jks"
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - name: Build signed AAB
        env:
          NOT_RELEASE_STORE_FILE: ${{ runner.temp }}/not-release.jks
          NOT_RELEASE_STORE_PASSWORD: ${{ secrets.NOT_RELEASE_STORE_PASSWORD }}
          NOT_RELEASE_KEY_ALIAS: ${{ secrets.NOT_RELEASE_KEY_ALIAS }}
          NOT_RELEASE_KEY_PASSWORD: ${{ secrets.NOT_RELEASE_KEY_PASSWORD }}
        run: >-
          flutter build appbundle --release
          --dart-define=SUPABASE_URL=${{ secrets.NOT_SUPABASE_URL }}
          --dart-define=SUPABASE_PUBLISHABLE_KEY=${{ secrets.NOT_SUPABASE_PUBLISHABLE_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: not-android-aab
          path: build/app/outputs/bundle/release/app-release.aab

  macos:
    if: inputs.platform == 'macos'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - name: Import Developer ID certificate
        env:
          CERT_B64: ${{ secrets.NOT_MACOS_CERTIFICATE_B64 }}
          CERT_PASSWORD: ${{ secrets.NOT_MACOS_CERTIFICATE_PASSWORD }}
        run: |
          test -n "$CERT_B64"
          security create-keychain -p actions "$RUNNER_TEMP/not.keychain-db"
          security default-keychain -s "$RUNNER_TEMP/not.keychain-db"
          security unlock-keychain -p actions "$RUNNER_TEMP/not.keychain-db"
          echo "$CERT_B64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$RUNNER_TEMP/not.keychain-db" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k actions "$RUNNER_TEMP/not.keychain-db"
      - name: Build macOS release
        run: >-
          flutter build macos --release
          --dart-define=SUPABASE_URL=${{ secrets.NOT_SUPABASE_URL }}
          --dart-define=SUPABASE_PUBLISHABLE_KEY=${{ secrets.NOT_SUPABASE_PUBLISHABLE_KEY }}
      - name: Sign app with Developer ID
        env:
          SIGN_ID: ${{ secrets.NOT_MACOS_SIGN_IDENTITY }}
        run: |
          test -n "$SIGN_ID"
          APP_PATH=$(find build/macos/Build/Products/Release -maxdepth 1 -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH="build/macos/Build/Products/Release/not_app.app"
          fi
          codesign --force --deep --options runtime --timestamp --sign "$SIGN_ID" "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
      - name: Prepare zip for notarization
        run: |
          APP_PATH=$(find build/macos/Build/Products/Release -maxdepth 1 -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH="build/macos/Build/Products/Release/not_app.app"
          fi
          ditto -c -k --keepParent "$APP_PATH" not-macos-submission.zip
      - name: Notarize macOS app with Apple Notary Service
        env:
          APPLE_ID: ${{ secrets.NOT_APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.NOT_APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.NOT_APPLE_TEAM_ID }}
          APPLE_API_KEY_B64: ${{ secrets.NOT_APPLE_API_KEY_B64 }}
          APPLE_API_KEY_ID: ${{ secrets.NOT_APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.NOT_APPLE_API_ISSUER }}
        run: |
          if [ -n "$APPLE_API_KEY_B64" ] && [ -n "$APPLE_API_KEY_ID" ] && [ -n "$APPLE_API_ISSUER" ]; then
            echo "$APPLE_API_KEY_B64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
            xcrun notarytool submit not-macos-submission.zip \
              --key "$RUNNER_TEMP/AuthKey.p8" \
              --key-id "$APPLE_API_KEY_ID" \
              --issuer "$APPLE_API_ISSUER" \
              --wait
          else
            test -n "$APPLE_ID"
            test -n "$APPLE_APP_SPECIFIC_PASSWORD"
            test -n "$APPLE_TEAM_ID"
            xcrun notarytool submit not-macos-submission.zip \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_APP_SPECIFIC_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --wait
          fi
      - name: Staple notarization ticket
        run: |
          APP_PATH=$(find build/macos/Build/Products/Release -maxdepth 1 -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH="build/macos/Build/Products/Release/not_app.app"
          fi
          xcrun stapler staple "$APP_PATH"
          xcrun stapler validate "$APP_PATH"
      - name: Verify Gatekeeper assessment
        run: |
          APP_PATH=$(find build/macos/Build/Products/Release -maxdepth 1 -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH="build/macos/Build/Products/Release/not_app.app"
          fi
          spctl --assess --type execute --verbose "$APP_PATH"
      - name: Package notarized macOS app
        run: |
          APP_PATH=$(find build/macos/Build/Products/Release -maxdepth 1 -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH="build/macos/Build/Products/Release/not_app.app"
          fi
          ditto -c -k --keepParent "$APP_PATH" not-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: not-macos-app
          path: not-macos.zip

  ios:
    if: inputs.platform == 'ios'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Require Apple signing material
        env:
          CERT_B64: ${{ secrets.NOT_IOS_CERTIFICATE_B64 }}
          PROFILE_B64: ${{ secrets.NOT_IOS_PROVISIONING_PROFILE_B64 }}
        run: |
          test -n "$CERT_B64"
          test -n "$PROFILE_B64"
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - name: Import distribution certificate and profile
        env:
          CERT_B64: ${{ secrets.NOT_IOS_CERTIFICATE_B64 }}
          CERT_PASSWORD: ${{ secrets.NOT_IOS_CERTIFICATE_PASSWORD }}
          PROFILE_B64: ${{ secrets.NOT_IOS_PROVISIONING_PROFILE_B64 }}
        run: |
          security create-keychain -p actions "$RUNNER_TEMP/not.keychain-db"
          security default-keychain -s "$RUNNER_TEMP/not.keychain-db"
          security unlock-keychain -p actions "$RUNNER_TEMP/not.keychain-db"
          echo "$CERT_B64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$RUNNER_TEMP/not.keychain-db" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k actions "$RUNNER_TEMP/not.keychain-db"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$PROFILE_B64" | base64 --decode > "$HOME/Library/MobileDevice/Provisioning Profiles/not.mobileprovision"
      - name: Build signed IPA
        run: >-
          flutter build ipa --release
          --dart-define=SUPABASE_URL=${{ secrets.NOT_SUPABASE_URL }}
          --dart-define=SUPABASE_PUBLISHABLE_KEY=${{ secrets.NOT_SUPABASE_PUBLISHABLE_KEY }}
      - name: Validate IPA for App Store Connect
        env:
          APPLE_ID: ${{ secrets.NOT_APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.NOT_APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_API_KEY_B64: ${{ secrets.NOT_APPLE_API_KEY_B64 }}
          APPLE_API_KEY_ID: ${{ secrets.NOT_APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.NOT_APPLE_API_ISSUER }}
        run: |
          IPA_PATH=$(find build/ios/ipa -name "*.ipa" | head -n 1)
          test -n "$IPA_PATH"
          if [ -n "$APPLE_API_KEY_B64" ] && [ -n "$APPLE_API_KEY_ID" ] && [ -n "$APPLE_API_ISSUER" ]; then
            mkdir -p ~/.appstoreconnect/private_keys ~/.private_keys
            echo "$APPLE_API_KEY_B64" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8
            echo "$APPLE_API_KEY_B64" | base64 --decode > ~/.private_keys/AuthKey_${APPLE_API_KEY_ID}.p8
            xcrun altool --validate-app --type ios --file "$IPA_PATH" --apiKey "$APPLE_API_KEY_ID" --apiIssuer "$APPLE_API_ISSUER"
          else
            test -n "$APPLE_ID"
            test -n "$APPLE_APP_SPECIFIC_PASSWORD"
            xcrun altool --validate-app --type ios --file "$IPA_PATH" --username "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD"
          fi
      - name: Upload IPA to App Store Connect / TestFlight
        env:
          APPLE_ID: ${{ secrets.NOT_APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.NOT_APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_API_KEY_B64: ${{ secrets.NOT_APPLE_API_KEY_B64 }}
          APPLE_API_KEY_ID: ${{ secrets.NOT_APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.NOT_APPLE_API_ISSUER }}
        run: |
          IPA_PATH=$(find build/ios/ipa -name "*.ipa" | head -n 1)
          test -n "$IPA_PATH"
          if [ -n "$APPLE_API_KEY_B64" ] && [ -n "$APPLE_API_KEY_ID" ] && [ -n "$APPLE_API_ISSUER" ]; then
            xcrun altool --upload-app --type ios --file "$IPA_PATH" --apiKey "$APPLE_API_KEY_ID" --apiIssuer "$APPLE_API_ISSUER"
          else
            xcrun altool --upload-app --type ios --file "$IPA_PATH" --username "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: not-ios-ipa
          path: build/ios/ipa/*.ipa
