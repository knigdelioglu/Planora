name: Verify Supabase secrets

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/verify_supabase_secrets.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.NOT_SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NOT_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Check Supabase repository secrets
        shell: bash
        run: |
          set -euo pipefail
          failed=0

          if [[ -z "${SUPABASE_URL:-}" ]]; then
            echo "::error::NOT_SUPABASE_URL is missing"
            failed=1
          elif [[ ! "$SUPABASE_URL" =~ ^https://[^/]+\.supabase\.co/?$ ]]; then
            echo "::error::NOT_SUPABASE_URL is present but does not look like a Supabase project URL"
            failed=1
          else
            echo "NOT_SUPABASE_URL: present"
          fi

          if [[ -z "${SUPABASE_PUBLISHABLE_KEY:-}" ]]; then
            echo "::error::NOT_SUPABASE_PUBLISHABLE_KEY is missing"
            failed=1
          elif [[ "$SUPABASE_PUBLISHABLE_KEY" != sb_publishable_* && "$SUPABASE_PUBLISHABLE_KEY" != eyJ* ]]; then
            echo "::error::NOT_SUPABASE_PUBLISHABLE_KEY is present but has an unexpected format"
            failed=1
          else
            echo "NOT_SUPABASE_PUBLISHABLE_KEY: present"
          fi

          if (( failed != 0 )); then
            exit 1
          fi

          echo "Supabase client secrets are configured. Values were not printed."
