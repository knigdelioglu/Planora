name: Fix analyzer infos v2

on:
  push:
    paths:
      - tools/fix_analyzer_infos_v2.trigger

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Apply analyzer-safe API updates
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              found = text.count(old)
              if found != count:
                  raise SystemExit(f'{path}: expected {count} occurrences, found {found}: {old!r}')
              p.write_text(text.replace(old, new))

          replace_exact('lib/app/widgets/content/app_content.dart', '        if (trailing != null) trailing!,', '        ?trailing,')
          replace_exact('lib/app/widgets/navigation/app_sidebar_item.dart', '                  if (trailing != null) trailing!,', '                  ?trailing,')
          replace_exact('lib/app/widgets/overlays/app_sheet.dart', '        if (trailing != null) trailing!,', '        ?trailing,')
          replace_exact('lib/features/kanban/presentation/screens/card_detail_screen.dart', '      Navigator.of(context).maybePop();', '      unawaited(Navigator.of(context).maybePop());')
          replace_exact('lib/features/kanban/presentation/screens/card_detail_screen.dart', '                          value: card.columnId,', '                          initialValue: card.columnId,')
          replace_exact('lib/features/kanban/presentation/screens/kanban_board_screen.dart', '                            separatorBuilder: (_, __) =>', '                            separatorBuilder: (_, _) =>')
          replace_exact('lib/features/kanban/presentation/screens/kanban_board_screen.dart', 'onDraggableCanceled: (_, __) => onDragEnd(),', 'onDraggableCanceled: (_, _) => onDragEnd(),', count=2)
          replace_exact('lib/features/kanban/presentation/screens/kanban_board_screen.dart', '              value: _columnId,', '              initialValue: _columnId,')
          replace_exact('lib/features/notes/presentation/screens/note_editor_screen.dart', '  Future<void> _trashNote() async {\n    await _persist(showState: false);\n    final repository = ref.read(notesRepositoryProvider);', '  Future<void> _trashNote() async {\n    await _persist(showState: false);\n    if (!mounted) return;\n    final repository = ref.read(notesRepositoryProvider);')
          replace_exact('lib/features/notes/presentation/screens/note_editor_screen.dart', '  void _reorder(int oldIndex, int newIndex) {\n    if (newIndex > oldIndex) newIndex -= 1;', '  void _reorderItem(int oldIndex, int newIndex) {')
          replace_exact('lib/features/notes/presentation/screens/note_editor_screen.dart', '                                onReorder: _reorder,', '                                onReorderItem: _reorderItem,')
          replace_exact('lib/features/notes/presentation/screens/note_editor_screen.dart', '                  errorBuilder: (_, __, ___) => _fileTile(context, name),', '                  errorBuilder: (_, _, _) => _fileTile(context, name),')
          replace_exact('lib/features/settings/presentation/settings_screen.dart', '                      if (!mounted) return;\n                      final health = services.syncCoordinator.currentHealth;', '                      if (!context.mounted) return;\n                      final health = services.syncCoordinator.currentHealth;')
          PY
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: dart format lib test
      - name: Verify analyzer is clean
        run: flutter analyze
      - name: Commit analyzer fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib test lib/core/database/app_database.g.dart
          git commit -m "Resolve Flutter analyzer issues" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
