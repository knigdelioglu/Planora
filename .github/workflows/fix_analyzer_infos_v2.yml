name: Clean tags smart views merge blockers

on:
  push:
    branches: [agent/run-tests]
    paths:
      - tools/fix_analyzer_infos_v2.trigger

permissions:
  contents: write
  issues: write

jobs:
  clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/tags-smart-views
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Apply merge-readiness cleanup
        shell: bash
        run: |
          python3 - <<'PY' | tee /tmp/cleanup-report.txt
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              found = text.count(old)
              print(f'{path}: found {found} occurrence(s)')
              if found != count:
                  raise SystemExit(f'{path}: expected {count} occurrence(s), found {found}')
              p.write_text(text.replace(old, new, count))

          # Narrow constructor lint handling instead of file-wide suppression.
          replace(
              'lib/core/sync/local_entity_store.dart',
              '// ignore_for_file: prefer_initializing_formals\n\n',
              '',
          )
          replace(
              'lib/core/sync/local_entity_store.dart',
              '''  LocalEntityStore({
    required this._database,
    required AppClock clock,
    EntityChangeBus? changes,
  }) : _changes = changes;''',
              '''  LocalEntityStore({
    required this._database,
    required AppClock clock,
    this._changes,
  });''',
          )

          replace(
              'lib/features/smart_views/data/repositories/smart_views_repository_impl.dart',
              '// ignore_for_file: prefer_initializing_formals, close_sinks\n\n',
              '',
          )
          replace(
              'lib/features/smart_views/data/repositories/smart_views_repository_impl.dart',
              '''  DriftSmartViewsRepository({
    required AppDatabase database,
    required SyncQueueRepository syncQueue,
    required AppClock clock,
    required EntityChangeBus changes,
    Uuid? uuid,
  }) : _database = database,
       _syncQueue = syncQueue,
       _clock = clock,
       _changes = changes,
       _uuid = uuid ?? const Uuid();''',
              '''  DriftSmartViewsRepository({
    required this._database,
    required this._syncQueue,
    required this._clock,
    required this._changes,
    Uuid? uuid,
  }) : _uuid = uuid ?? const Uuid();''',
          )
          replace(
              'lib/features/smart_views/data/repositories/smart_views_repository_impl.dart',
              '    late StreamController<List<SmartViewResult>> controller;',
              '''    // The broadcast controller intentionally stays re-listenable; onCancel
    // releases every external subscription, so no resource remains retained.
    // ignore: close_sinks
    late StreamController<List<SmartViewResult>> controller;''',
          )
          replace(
              'lib/features/smart_views/data/repositories/smart_views_repository_impl.dart',
              '    late StreamController<T> controller;',
              '''    // The broadcast controller intentionally stays re-listenable; onCancel
    // releases the external subscription, so no resource remains retained.
    // ignore: close_sinks
    late StreamController<T> controller;''',
          )

          replace(
              'lib/features/tags/data/repositories/tags_repository_impl.dart',
              '// ignore_for_file: prefer_initializing_formals, close_sinks\n\n',
              '',
          )
          replace(
              'lib/features/tags/data/repositories/tags_repository_impl.dart',
              '''  DriftTagsRepository({
    required AppDatabase database,
    required SyncQueueRepository syncQueue,
    required AppClock clock,
    required EntityChangeBus changes,
  }) : _database = database,
       _syncQueue = syncQueue,
       _clock = clock,
       _changes = changes;''',
              '''  DriftTagsRepository({
    required this._database,
    required this._syncQueue,
    required this._clock,
    required this._changes,
  });''',
          )
          replace(
              'lib/features/tags/data/repositories/tags_repository_impl.dart',
              '    late StreamController<T> controller;',
              '''    // The broadcast controller intentionally stays re-listenable; onCancel
    // releases the external subscription, so no resource remains retained.
    // ignore: close_sinks
    late StreamController<T> controller;''',
          )

          # Saved Smart Views must tolerate a board/column being deleted later.
          replace(
              'lib/features/smart_views/presentation/screens/smart_views_screen.dart',
              '''  for (final BoardEntity board in boards) {
    final KanbanSnapshot? snapshot = await ref
        .read(kanbanRepositoryProvider)
        .watchBoard(board.id)
        .first;
    if (snapshot != null) snapshots[board.id] = snapshot;
  }
  if (!context.mounted) {''',
              '''  for (final BoardEntity board in boards) {
    final KanbanSnapshot? snapshot = await ref
        .read(kanbanRepositoryProvider)
        .watchBoard(board.id)
        .first;
    if (snapshot != null) snapshots[board.id] = snapshot;
  }
  if (boardId == null) {
    columnId = null;
  } else if (!boards.any((board) => board.id == boardId)) {
    boardId = null;
    columnId = null;
  } else if (columnId != null &&
      !(snapshots[boardId]?.columns.any((column) => column.id == columnId) ??
          false)) {
    columnId = null;
  }
  if (!context.mounted) {''',
          )

          # Avoid nullable DropdownButton values; use a stable string sentinel.
          replace(
              'lib/features/search/presentation/screens/search_screen.dart',
              '''                  DropdownButtonFormField<int?>(
                    initialValue: updatedWithinDays,
                    decoration: const InputDecoration(labelText: 'Güncellenme'),
                    items: const <DropdownMenuItem<int?>>[
                      DropdownMenuItem<int?>(
                        value: null,
                        child: Text('Tüm zamanlar'),
                      ),
                      DropdownMenuItem<int?>(
                        value: 1,
                        child: Text('Son 24 saat'),
                      ),
                      DropdownMenuItem<int?>(
                        value: 7,
                        child: Text('Son 7 gün'),
                      ),
                      DropdownMenuItem<int?>(
                        value: 30,
                        child: Text('Son 30 gün'),
                      ),
                      DropdownMenuItem<int?>(
                        value: 90,
                        child: Text('Son 90 gün'),
                      ),
                    ],
                    onChanged: (value) =>
                        setDialogState(() => updatedWithinDays = value),
                  ),''',
              '''                  DropdownButtonFormField<String>(
                    initialValue: updatedWithinDays?.toString() ?? 'all',
                    decoration: const InputDecoration(labelText: 'Güncellenme'),
                    items: const <DropdownMenuItem<String>>[
                      DropdownMenuItem(
                        value: 'all',
                        child: Text('Tüm zamanlar'),
                      ),
                      DropdownMenuItem(value: '1', child: Text('Son 24 saat')),
                      DropdownMenuItem(value: '7', child: Text('Son 7 gün')),
                      DropdownMenuItem(value: '30', child: Text('Son 30 gün')),
                      DropdownMenuItem(value: '90', child: Text('Son 90 gün')),
                    ],
                    onChanged: (value) => setDialogState(() {
                      updatedWithinDays = value == null || value == 'all'
                          ? null
                          : int.tryParse(value);
                    }),
                  ),''',
          )

          # Keep cross-feature tag access behind the public UI barrel.
          replace(
              'lib/features/kanban/presentation/screens/card_detail_screen.dart',
              "import 'package:not_app/features/tags/domain/entities/tag.dart';\nimport 'package:not_app/features/tags/presentation/widgets/tag_strip.dart';",
              "import 'package:not_app/features/tags/public/tags_ui.dart';",
          )
          PY
      - name: Canonical format
        run: dart format \
          lib/core/sync/local_entity_store.dart \
          lib/features/smart_views/data/repositories/smart_views_repository_impl.dart \
          lib/features/tags/data/repositories/tags_repository_impl.dart \
          lib/features/smart_views/presentation/screens/smart_views_screen.dart \
          lib/features/search/presentation/screens/search_screen.dart \
          lib/features/kanban/presentation/screens/card_detail_screen.dart
      - name: Commit cleanup to feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            lib/core/sync/local_entity_store.dart \
            lib/features/smart_views/data/repositories/smart_views_repository_impl.dart \
            lib/features/tags/data/repositories/tags_repository_impl.dart \
            lib/features/smart_views/presentation/screens/smart_views_screen.dart \
            lib/features/search/presentation/screens/search_screen.dart \
            lib/features/kanban/presentation/screens/card_detail_screen.dart
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: harden tags smart views merge readiness"
          git push origin HEAD:feature/tags-smart-views
      - name: Publish cleanup report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          status='${{ job.status }}'
          gh issue create \
            --title "[CI merge-ready cleanup] tags-smart-views ${status}" \
            --body "Cleanup job status: ${status}. Feature branch: feature/tags-smart-views."
