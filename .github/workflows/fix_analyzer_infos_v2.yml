name: Final fast merge gates tags smart views

on:
  push:
    branches: [agent/run-tests]
    paths:
      - tools/fix_analyzer_infos_v2.trigger

permissions:
  contents: read
  issues: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/tags-smart-views
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - name: Run fast merge gates
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          report="$RUNNER_TEMP/final-fast-gates.md"
          overall=0
          echo '# Final fast merge gates' > "$report"
          echo >> "$report"
          echo "Validated feature head: $(git rev-parse HEAD)" >> "$report"
          echo >> "$report"
          run_gate() {
            label="$1"
            cmd="$2"
            log="$RUNNER_TEMP/$(echo "$label" | tr ' ' '_' | tr '[:upper:]' '[:lower:]').log"
            echo "## $label" >> "$report"
            timeout 20m bash -lc "$cmd" > "$log" 2>&1
            code=$?
            if [ "$code" -eq 0 ]; then
              echo 'Status: PASS' >> "$report"
            else
              echo "Status: FAIL (exit $code)" >> "$report"
              overall=1
            fi
            echo '```text' >> "$report"
            tail -n 220 "$log" >> "$report"
            echo '```' >> "$report"
            echo >> "$report"
          }
          run_gate 'Formatting' 'dart format --output=none --set-exit-if-changed lib test'
          run_gate 'Static analysis' 'flutter analyze'
          run_gate 'Migration tests' 'flutter test test/database/app_database_migration_test.dart test/database/tags_smart_views_migration_test.dart --concurrency=1'
          run_gate 'All Flutter tests' 'flutter test --coverage --concurrency=1'
          if [ "$overall" -eq 0 ]; then
            title='[CI final fast gates] tags-smart-views PASS'
          else
            title='[CI final fast gates] tags-smart-views FAIL'
          fi
          gh issue create --title "$title" --body-file "$report"
          exit "$overall"
