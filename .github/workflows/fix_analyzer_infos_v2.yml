name: Fix tags smart views merge readiness

on:
  push:
    branches: [agent/run-tests]
    paths:
      - tools/fix_analyzer_infos_v2.trigger

permissions:
  contents: write
  issues: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/tags-smart-views
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Apply targeted merge-readiness fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          changes = []
          misses = []

          def sub(path, pattern, replacement, count=1, label=None):
              p = Path(path)
              text = p.read_text()
              updated, found = re.subn(pattern, replacement, text, count=count, flags=re.MULTILINE)
              if found:
                  p.write_text(updated)
                  changes.append(label or path)
              else:
                  misses.append(label or path)

          sub('lib/features/notes/presentation/screens/note_editor_screen.dart', r"\s+const SizedBox\(height: 10\),\n\s+TagStrip\(\n\s+targetType: TagTargetType\.note,\n\s+targetId: widget\.noteId,\n\s+\),\n\s+const SizedBox\(height: 18\),", "\n                              const SizedBox(height: 18),", label='note editor inline tag strip')
          sub('lib/features/search/presentation/screens/search_screen.dart', r"\? const EmptyState\(\n\s+icon: Icons\.search_off_rounded,\n\s+title: 'Sonuç bulunamadı',\n\s+message:\n\s+'Arama kelimesini veya filtreleri değiştirin\.',\n\s+\)", """? EmptyState(
                                icon: Icons.search_off_rounded,
                                title: 'Sonuç bulunamadı',
                                message: _hasAdvancedFilters
                                    ? 'Arama kelimesini veya filtreleri değiştirin.'
                                    : 'Farklı bir kelime deneyin.',
                              )""", label='search empty state')
          sub('lib/features/search/presentation/screens/search_screen.dart', r"^    Set<String> tagIds = Set<String>\.from\(_tagIds\);$", '    final Set<String> tagIds = Set<String>.from(_tagIds);', label='search final locals')
          sub('lib/core/sync/local_entity_store.dart', r"final class LocalEntityStore \{\n  LocalEntityStore\(\{\n    required this\._database,\n    required AppClock clock,\n    EntityChangeBus\? changes,\n  \}\) : _changes = changes;", """final class LocalEntityStore {
  factory LocalEntityStore({
    required AppDatabase database,
    required AppClock clock,
    EntityChangeBus? changes,
  }) => LocalEntityStore._(database, changes);

  LocalEntityStore._(this._database, this._changes);""", label='local store constructor')
          sub('lib/features/smart_views/data/repositories/smart_views_repository_impl.dart', r"final class DriftSmartViewsRepository implements SmartViewsRepository \{\n  DriftSmartViewsRepository\(\{\n    required AppDatabase database,\n    required SyncQueueRepository syncQueue,\n    required AppClock clock,\n    required EntityChangeBus changes,\n    Uuid\? uuid,\n  \}\) : _database = database,\n       _syncQueue = syncQueue,\n       _clock = clock,\n       _changes = changes,\n       _uuid = uuid \?\? const Uuid\(\);", """final class DriftSmartViewsRepository implements SmartViewsRepository {
  factory DriftSmartViewsRepository({
    required AppDatabase database,
    required SyncQueueRepository syncQueue,
    required AppClock clock,
    required EntityChangeBus changes,
    Uuid? uuid,
  }) => DriftSmartViewsRepository._(
    database,
    syncQueue,
    clock,
    changes,
    uuid ?? const Uuid(),
  );

  DriftSmartViewsRepository._(
    this._database,
    this._syncQueue,
    this._clock,
    this._changes,
    this._uuid,
  );""", label='smart views constructor')
          sub('lib/features/smart_views/data/repositories/smart_views_repository_impl.dart', r"subscriptions\.clear\(\);\n      \},", """subscriptions.clear();
        if (!controller.isClosed) await controller.close();
      },""", label='smart views result controller close')
          sub('lib/features/smart_views/data/repositories/smart_views_repository_impl.dart', r"await subscription\?\.cancel\(\);\n        subscription = null;\n      \},", """await subscription?.cancel();
        subscription = null;
        if (!controller.isClosed) await controller.close();
      },""", label='smart views custom controller close')
          sub('lib/features/tags/data/repositories/tags_repository_impl.dart', r"final class DriftTagsRepository implements TagsRepository \{\n  DriftTagsRepository\(\{\n    required AppDatabase database,\n    required SyncQueueRepository syncQueue,\n    required AppClock clock,\n    required EntityChangeBus changes,\n  \}\) : _database = database,\n       _syncQueue = syncQueue,\n       _clock = clock,\n       _changes = changes;", """final class DriftTagsRepository implements TagsRepository {
  factory DriftTagsRepository({
    required AppDatabase database,
    required SyncQueueRepository syncQueue,
    required AppClock clock,
    required EntityChangeBus changes,
  }) => DriftTagsRepository._(database, syncQueue, clock, changes);

  DriftTagsRepository._(
    this._database,
    this._syncQueue,
    this._clock,
    this._changes,
  );""", label='tags constructor')
          sub('lib/features/tags/data/repositories/tags_repository_impl.dart', r"await subscription\?\.cancel\(\);\n        subscription = null;\n      \},", """await subscription?.cancel();
        subscription = null;
        if (!controller.isClosed) await controller.close();
      },""", label='tags controller close')
          sub('lib/features/smart_views/presentation/screens/smart_views_screen.dart', r'\bshowSmartViewEditor\(', '_showSmartViewEditor(', count=3, label='private smart view editor')
          sub('lib/features/tags/presentation/screens/tags_management_screen.dart', r'separatorBuilder: \(_, __\) => const SizedBox\(height: 2\),', 'separatorBuilder: (_, _) => const SizedBox(height: 2),', label='tag separator wildcard')

          print('applied:', ', '.join(changes) or 'none')
          print('missed:', ', '.join(misses) or 'none')
          PY
      - run: dart format lib test
      - name: Commit fixes to feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib test
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: clean tags smart views regressions"
          git push origin HEAD:feature/tags-smart-views
