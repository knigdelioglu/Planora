name: Phase 18 Dart lint autofix

on:
  push:
    paths:
      - tools/phase18_dart_fix.trigger

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - name: Apply Dart analyzer fixes
        run: dart fix --apply
      - name: Fix residual async-context and stream lifecycle lints
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}')
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'lib/features/kanban/presentation/screens/boards_screen.dart',
              "      }\n      if (value == 'delete') {\n",
              "      } else if (value == 'delete') {\n",
          )
          replace_once(
              'lib/features/kanban/presentation/screens/kanban_board_screen.dart',
              "      }\n      if (value == 'right' && columnIndex < snapshot.columns.length - 1) {\n",
              "      } else if (value == 'right' && columnIndex < snapshot.columns.length - 1) {\n",
          )
          replace_once(
              'lib/features/kanban/presentation/screens/kanban_board_screen.dart',
              "      }\n      if (value == 'rename') {\n",
              "      } else if (value == 'rename') {\n",
          )
          replace_once(
              'lib/features/kanban/presentation/screens/kanban_board_screen.dart',
              "      }\n      if (value == 'delete') {\n",
              "      } else if (value == 'delete') {\n",
          )
          replace_once(
              'lib/features/notes/presentation/screens/notes_screen.dart',
              "                              }\n                              if (value == 'delete') {\n",
              "                              } else if (value == 'delete') {\n",
          )
          replace_once(
              'lib/features/kanban/data/repositories/kanban_repository_impl.dart',
              "      await sc?.cancel();\n    },\n",
              "      await sc?.cancel();\n      if (!controller.isClosed) {\n        unawaited(controller.close());\n      }\n    },\n",
          )
          PY
      - name: Apply canonical formatting
        run: dart format lib test integration_test
      - name: Commit autofixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib test integration_test
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "phase 18: apply Dart analyzer autofixes"
          git push origin HEAD:main
