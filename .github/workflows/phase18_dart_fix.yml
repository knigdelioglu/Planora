name: Phase 18 Dart lint autofix

on:
  push:
    paths:
      - tools/phase18_dart_fix.trigger

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - name: Apply Dart analyzer fixes
        run: dart fix --apply
      - name: Apply canonical formatting
        run: dart format lib test integration_test
      - name: Commit autofixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib test integration_test
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "phase 18: apply Dart analyzer autofixes"
          git push origin HEAD:main
