name: Validate tag discovery fix

on:
  push:
    branches: [agent/run-tests]
    paths:
      - '.github/workflows/agent_run_tests.yml'

permissions:
  contents: read
  issues: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/tag-smart-view-discovery
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Validate
        id: validate
        shell: bash
        run: |
          set -u
          mkdir -p /tmp/tag-validation
          overall=0
          summary=/tmp/tag-validation/summary.txt
          : > "$summary"
          echo "head=$(git rev-parse HEAD)" >> "$summary"

          run_check() {
            name="$1"
            shift
            log="/tmp/tag-validation/${name}.log"
            set +e
            "$@" >"$log" 2>&1
            code=$?
            set -e
            echo "${name}=${code}" >> "$summary"
            if [ "$code" -ne 0 ]; then
              overall=1
              echo "--- ${name} failure ---" >> "$summary"
              tail -n 100 "$log" >> "$summary"
              echo "--- end ${name} ---" >> "$summary"
            fi
          }

          run_check pub_get flutter pub get
          run_check codegen dart run build_runner build --delete-conflicting-outputs
          run_check format dart format --output=none --set-exit-if-changed lib test
          run_check analyze flutter analyze
          run_check tag_discovery flutter test test/features/smart_views_tag_discovery_test.dart --concurrency=1
          run_check tags_core flutter test test/features/tags_smart_views_test.dart test/core/sync/tags_sync_dependency_test.dart --concurrency=1
          run_check full_tests flutter test --concurrency=1

          if [ "$overall" -eq 0 ]; then
            echo 'overall=PASS' >> "$summary"
          else
            echo 'overall=FAIL' >> "$summary"
          fi
          cat "$summary"
          exit "$overall"
      - name: Publish validation report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          status='${{ job.status }}'
          body=/tmp/tag-validation/summary.txt
          if [ ! -f "$body" ]; then
            printf 'validation workflow failed before checks\n' > "$body"
          fi
          gh issue create \
            --title "[CI tag discovery validation] ${status}" \
            --body-file "$body"
