name: Tags smart views merge-readiness validation

on:
  push:
    branches: [agent/run-tests]
    paths:
      - tools/quick_test.trigger

permissions:
  contents: read
  issues: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/tags-smart-views
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - name: Validate and publish report
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          report="$RUNNER_TEMP/tags-smart-views-merge-readiness.md"
          overall=0
          echo '# Planora Tags + Smart Views merge-readiness validation' > "$report"
          echo >> "$report"
          echo "Validated feature head: $(git rev-parse HEAD)" >> "$report"
          echo "Run: $GITHUB_RUN_ID" >> "$report"
          echo >> "$report"

          run_check() {
            label="$1"
            cmd="$2"
            timeout_value="$3"
            log="$RUNNER_TEMP/$(echo "$label" | tr ' ' '_' | tr '[:upper:]' '[:lower:]').log"
            echo "## $label" >> "$report"
            timeout "$timeout_value" bash -lc "$cmd" > "$log" 2>&1
            code=$?
            if [ "$code" -eq 0 ]; then
              echo 'Status: PASS' >> "$report"
            else
              echo "Status: FAIL (exit $code)" >> "$report"
              overall=1
            fi
            echo '```text' >> "$report"
            tail -n 300 "$log" >> "$report"
            echo '```' >> "$report"
            echo >> "$report"
          }

          run_check 'Formatting' 'dart format --output=none --set-exit-if-changed lib test' '10m'
          run_check 'Static analysis' 'flutter analyze' '15m'
          run_check 'All Flutter tests' 'flutter test --coverage --concurrency=1' '25m'
          run_check 'Integration tests' 'flutter test test/integration --concurrency=1' '20m'
          run_check 'Tags Smart Views core tests' 'flutter test test/features/tags_smart_views_test.dart test/database/tags_smart_views_migration_test.dart test/core/sync/tags_sync_dependency_test.dart --concurrency=1' '15m'
          run_check 'Tags Smart Views performance' 'flutter test test/features/tags_smart_views_performance_test.dart --concurrency=1' '15m'
          run_check 'Android debug build' 'flutter build apk --debug' '25m'

          if [ "$overall" -eq 0 ]; then
            title='[CI merge-ready tags-smart-views] PASS'
          else
            title='[CI merge-ready tags-smart-views] FAIL'
          fi
          gh issue create --title "$title" --body-file "$report"
          exit "$overall"
