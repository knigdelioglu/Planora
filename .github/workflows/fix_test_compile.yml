name: Fix final tags smart views gates

on:
  push:
    branches: [agent/run-tests]
    paths:
      - tools/fix_test_compile.trigger

permissions:
  contents: write
  issues: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/tags-smart-views
          fetch-depth: 0
      - name: Fix analyzer lint and migration expectations
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              found = text.count(old)
              print(f'{path}: {found} match(es)')
              if found != count:
                  raise SystemExit(f'{path}: expected {count}, found {found}')
              p.write_text(text.replace(old, new, count))

          replace(
              'lib/features/smart_views/presentation/screens/smart_views_screen.dart',
              '                          onChanged: (value) {\n                            if (value != null)\n                              setState(() => sortField = value);\n                          },',
              '                          onChanged: (value) {\n                            if (value != null) {\n                              setState(() => sortField = value);\n                            }\n                          },',
          )

          path = Path('test/database/app_database_migration_test.dart')
          text = path.read_text()
          text = text.replace(
              "test('schema v1 fixture migrates to v4 without data loss'",
              "test('schema v1 fixture migrates to v5 without data loss'",
              1,
          )
          text = text.replace(
              "test('schema v2 fixture migrates conflict rows to v4'",
              "test('schema v2 fixture migrates conflict rows to v5'",
              1,
          )
          found = text.count('expect(await _userVersion(db), 4);')
          print(f'migration version expectations: {found}')
          if found != 3:
              raise SystemExit(f'expected 3 v4 user_version assertions, found {found}')
          text = text.replace(
              'expect(await _userVersion(db), 4);',
              'expect(await _userVersion(db), 5);',
          )
          marker = "    expect(await _tableExists(db, 'card_note_links'), isTrue);\n"
          found = text.count(marker)
          print(f'card_note_links table assertions: {found}')
          if found < 2:
              raise SystemExit(f'expected at least 2 card_note_links assertions, found {found}')
          v5 = marker + "    expect(await _tableExists(db, 'tags'), isTrue);\n    expect(await _tableExists(db, 'tag_assignments'), isTrue);\n    expect(await _tableExists(db, 'smart_views'), isTrue);\n"
          text = text.replace(marker, v5, 1)
          second = text.find(marker, text.find(v5) + len(v5))
          if second < 0:
              raise SystemExit('second card_note_links assertion not found')
          text = text[:second] + v5 + text[second + len(marker):]
          path.write_text(text)
          PY
      - name: Commit final gate fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            lib/features/smart_views/presentation/screens/smart_views_screen.dart \
            test/database/app_database_migration_test.dart
          git commit -m "test: align migration coverage with schema v5"
          git push origin HEAD:feature/tags-smart-views
      - name: Publish patch report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh issue create --title "[CI final gate patch] tags-smart-views ${{ job.status }}" --body "Final gate patch status: ${{ job.status }}."
