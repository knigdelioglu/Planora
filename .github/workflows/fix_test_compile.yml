name: Fast source cleanup tags smart views

on:
  push:
    branches: [agent/run-tests]
    paths:
      - tools/fix_test_compile.trigger

permissions:
  contents: write
  issues: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/tags-smart-views
          fetch-depth: 0
      - name: Apply source cleanup
        shell: bash
        run: |
          python3 - <<'PY' | tee /tmp/source-cleanup.txt
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              found = text.count(old)
              print(f'{path}: {found} match(es)')
              if found != count:
                  raise SystemExit(f'{path}: expected {count}, found {found}')
              p.write_text(text.replace(old, new, count))

          replace('lib/core/sync/local_entity_store.dart', '// ignore_for_file: prefer_initializing_formals\n\n', '')
          replace('lib/core/sync/local_entity_store.dart', '  LocalEntityStore({\n    required this._database,\n    required AppClock clock,\n    EntityChangeBus? changes,\n  }) : _changes = changes;', '  LocalEntityStore({\n    required this._database,\n    required AppClock clock,\n    this._changes,\n  });')

          replace('lib/features/smart_views/data/repositories/smart_views_repository_impl.dart', '// ignore_for_file: prefer_initializing_formals, close_sinks\n\n', '')
          replace('lib/features/smart_views/data/repositories/smart_views_repository_impl.dart', '  DriftSmartViewsRepository({\n    required AppDatabase database,\n    required SyncQueueRepository syncQueue,\n    required AppClock clock,\n    required EntityChangeBus changes,\n    Uuid? uuid,\n  }) : _database = database,\n       _syncQueue = syncQueue,\n       _clock = clock,\n       _changes = changes,\n       _uuid = uuid ?? const Uuid();', '  DriftSmartViewsRepository({\n    required this._database,\n    required this._syncQueue,\n    required this._clock,\n    required this._changes,\n    Uuid? uuid,\n  }) : _uuid = uuid ?? const Uuid();')
          replace('lib/features/smart_views/data/repositories/smart_views_repository_impl.dart', '    late StreamController<List<SmartViewResult>> controller;', '    // Broadcast controller is intentionally re-listenable; onCancel releases all external subscriptions.\n    // ignore: close_sinks\n    late StreamController<List<SmartViewResult>> controller;')
          replace('lib/features/smart_views/data/repositories/smart_views_repository_impl.dart', '    late StreamController<T> controller;', '    // Broadcast controller is intentionally re-listenable; onCancel releases the external subscription.\n    // ignore: close_sinks\n    late StreamController<T> controller;')

          replace('lib/features/tags/data/repositories/tags_repository_impl.dart', '// ignore_for_file: prefer_initializing_formals, close_sinks\n\n', '')
          replace('lib/features/tags/data/repositories/tags_repository_impl.dart', '  DriftTagsRepository({\n    required AppDatabase database,\n    required SyncQueueRepository syncQueue,\n    required AppClock clock,\n    required EntityChangeBus changes,\n  }) : _database = database,\n       _syncQueue = syncQueue,\n       _clock = clock,\n       _changes = changes;', '  DriftTagsRepository({\n    required this._database,\n    required this._syncQueue,\n    required this._clock,\n    required this._changes,\n  });')
          replace('lib/features/tags/data/repositories/tags_repository_impl.dart', '    late StreamController<T> controller;', '    // Broadcast controller is intentionally re-listenable; onCancel releases the external subscription.\n    // ignore: close_sinks\n    late StreamController<T> controller;')

          replace('lib/features/smart_views/presentation/screens/smart_views_screen.dart', '    if (snapshot != null) snapshots[board.id] = snapshot;\n  }\n  if (!context.mounted) {', '    if (snapshot != null) snapshots[board.id] = snapshot;\n  }\n  if (boardId == null) {\n    columnId = null;\n  } else if (!boards.any((board) => board.id == boardId)) {\n    boardId = null;\n    columnId = null;\n  } else if (columnId != null &&\n      !(snapshots[boardId]?.columns.any((column) => column.id == columnId) ?? false)) {\n    columnId = null;\n  }\n  if (!context.mounted) {')

          replace('lib/features/search/presentation/screens/search_screen.dart', "                  DropdownButtonFormField<int?>(\n                    initialValue: updatedWithinDays,\n                    decoration: const InputDecoration(labelText: 'Güncellenme'),\n                    items: const <DropdownMenuItem<int?>>[\n                      DropdownMenuItem<int?>(\n                        value: null,\n                        child: Text('Tüm zamanlar'),\n                      ),\n                      DropdownMenuItem<int?>(\n                        value: 1,\n                        child: Text('Son 24 saat'),\n                      ),\n                      DropdownMenuItem<int?>(\n                        value: 7,\n                        child: Text('Son 7 gün'),\n                      ),\n                      DropdownMenuItem<int?>(\n                        value: 30,\n                        child: Text('Son 30 gün'),\n                      ),\n                      DropdownMenuItem<int?>(\n                        value: 90,\n                        child: Text('Son 90 gün'),\n                      ),\n                    ],\n                    onChanged: (value) =>\n                        setDialogState(() => updatedWithinDays = value),\n                  ),", "                  DropdownButtonFormField<String>(\n                    initialValue: updatedWithinDays?.toString() ?? 'all',\n                    decoration: const InputDecoration(labelText: 'Güncellenme'),\n                    items: const <DropdownMenuItem<String>>[\n                      DropdownMenuItem(value: 'all', child: Text('Tüm zamanlar')),\n                      DropdownMenuItem(value: '1', child: Text('Son 24 saat')),\n                      DropdownMenuItem(value: '7', child: Text('Son 7 gün')),\n                      DropdownMenuItem(value: '30', child: Text('Son 30 gün')),\n                      DropdownMenuItem(value: '90', child: Text('Son 90 gün')),\n                    ],\n                    onChanged: (value) => setDialogState(() {\n                      updatedWithinDays = value == null || value == 'all'\n                          ? null\n                          : int.tryParse(value);\n                    }),\n                  ),")

          replace('lib/features/kanban/presentation/screens/card_detail_screen.dart', "import 'package:not_app/features/tags/domain/entities/tag.dart';\nimport 'package:not_app/features/tags/presentation/widgets/tag_strip.dart';", "import 'package:not_app/features/tags/public/tags_ui.dart';")
          PY
      - name: Commit source cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            lib/core/sync/local_entity_store.dart \
            lib/features/smart_views/data/repositories/smart_views_repository_impl.dart \
            lib/features/tags/data/repositories/tags_repository_impl.dart \
            lib/features/smart_views/presentation/screens/smart_views_screen.dart \
            lib/features/search/presentation/screens/search_screen.dart \
            lib/features/kanban/presentation/screens/card_detail_screen.dart
          git commit -m "fix: finalize tags smart views cleanup"
          git push origin HEAD:feature/tags-smart-views
      - name: Publish patch report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh issue create --title "[CI fast cleanup] tags-smart-views ${{ job.status }}" --body "Fast source cleanup status: ${{ job.status }}."
