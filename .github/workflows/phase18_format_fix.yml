name: Format tags smart views feature

on:
  push:
    branches: [agent/run-tests]
    paths:
      - tools/phase18_format.trigger

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/tags-smart-views
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Apply canonical Dart formatting
        run: dart format lib test
      - name: Commit formatting to feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib test
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: apply canonical Dart formatting"
          git push origin HEAD:feature/tags-smart-views
