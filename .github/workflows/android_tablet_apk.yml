name: Android tablet APK (Supabase)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'android/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/android_tablet_apk.yml'

permissions:
  contents: read

concurrency:
  group: android-tablet-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.NOT_SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NOT_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Require Supabase client configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_URL:-}" || { echo "::error::NOT_SUPABASE_URL is missing"; exit 1; }
          test -n "${SUPABASE_PUBLISHABLE_KEY:-}" || { echo "::error::NOT_SUPABASE_PUBLISHABLE_KEY is missing"; exit 1; }

      - name: Get dependencies
        run: flutter pub get

      - name: Generate sources
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build installable tablet APK with Supabase
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --release \
            --dart-define=APP_ENV=production \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"

      - name: Prepare artifact
        shell: bash
        run: |
          set -euo pipefail
          cp build/app/outputs/flutter-apk/app-release.apk planora-tablet.apk
          sha256sum planora-tablet.apk > planora-tablet.apk.sha256

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: planora-android-tablet-apk
          path: |
            planora-tablet.apk
            planora-tablet.apk.sha256
          retention-days: 14
          if-no-files-found: error
