name: Android tablet APK (Supabase)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'android/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/android_tablet_apk.yml'

permissions:
  contents: write

concurrency:
  group: android-tablet-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.NOT_SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NOT_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Require Supabase client configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_URL:-}" || { echo "::error::NOT_SUPABASE_URL is missing"; exit 1; }
          test -n "${SUPABASE_PUBLISHABLE_KEY:-}" || { echo "::error::NOT_SUPABASE_PUBLISHABLE_KEY is missing"; exit 1; }

      - name: Get dependencies
        run: flutter pub get

      - name: Generate sources
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build installable tablet APK with Supabase
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --release \
            --dart-define=APP_ENV=production \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"

      - name: Prepare artifact
        id: package
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(awk '/^version:/ {print $2}' pubspec.yaml | cut -d+ -f1)"
          TAG="v${VERSION}"
          TABLET_APK="planora-tablet.apk"
          RELEASE_APK="Planora-${VERSION}-android.apk"

          cp build/app/outputs/flutter-apk/app-release.apk "$TABLET_APK"
          sha256sum "$TABLET_APK" > "${TABLET_APK}.sha256"

          cp "$TABLET_APK" "$RELEASE_APK"
          sha256sum "$RELEASE_APK" > "${RELEASE_APK}.sha256"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "release_apk=$RELEASE_APK" >> "$GITHUB_OUTPUT"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: planora-android-tablet-apk
          path: |
            planora-tablet.apk
            planora-tablet.apk.sha256
          retention-days: 14
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.package.outputs.tag }}
          VERSION: ${{ steps.package.outputs.version }}
          APK: ${{ steps.package.outputs.release_apk }}
        run: |
          set -euo pipefail

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; keeping the existing versioned release."
            exit 0
          fi

          gh release create "$TAG" \
            "$APK" \
            "${APK}.sha256" \
            --target "$GITHUB_SHA" \
            --title "Planora $VERSION" \
            --generate-notes \
            --latest
