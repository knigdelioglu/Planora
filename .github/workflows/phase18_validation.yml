name: Phase 18 validation

on:
  push:
    paths:
      - tools/phase18.trigger
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Generate Drift code
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Reject production placeholders
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE '\b(TODO|FIXME|XXX)\b|UnimplementedError|UnsupportedError\(|not implemented|placeholder' lib; then
            echo 'Production placeholder detected.' >&2
            exit 1
          fi
      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Static analysis
        run: flutter analyze
      - name: Run unit database and widget tests
        run: flutter test --coverage
      - name: Run integration tests
        run: flutter test test/integration

  android-build:
    needs: test-and-analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - name: Android debug build
        run: flutter build apk --debug
      - name: Android release compilation
        run: flutter build appbundle --release --dart-define=APP_ENV=production

  apple-builds:
    needs: test-and-analyze
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - name: macOS debug build
        run: flutter build macos --debug
      - name: macOS release build
        run: flutter build macos --release --dart-define=APP_ENV=production
      - name: iOS simulator debug build
        run: flutter build ios --debug --simulator
      - name: iOS release compilation without signing
        run: flutter build ios --release --no-codesign --dart-define=APP_ENV=production
