name: Phase 18 diagnostic

on:
  push:
    branches:
      - agent/ci-diagnostic-20260819
    paths:
      - tools/phase18.trigger

permissions:
  contents: write
  issues: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
      SUPABASE_URL: ${{ secrets.NOT_SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NOT_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Open diagnostic tracking issue
        id: tracking
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          issue_url=$(gh issue create \
            --title "[CI diagnostic] Planora attempt 26" \
            --body "GitHub Actions validation with PostgreSQL service and Storage RLS harness fix started for branch \`agent/ci-diagnostic-20260819\` at commit \`$GITHUB_SHA\`. Results will be posted here automatically.")
          echo "issue_url=$issue_url" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Mirror Supabase Storage RLS in local PostgreSQL harness
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('test/helpers/postgres_rls_harness.dart')
          text = path.read_text()
          marker = 'ALTER TABLE storage.objects ENABLE ROW LEVEL SECURITY;'
          if marker not in text:
              old = """  metadata jsonb DEFAULT '{}'::jsonb
);

CREATE OR REPLACE FUNCTION storage.foldername(name text)
"""
              new = """  metadata jsonb DEFAULT '{}'::jsonb
);

-- Supabase Storage ships storage.objects with RLS enabled. The local test
-- double owns its mock table, so it must enable RLS explicitly before the
-- production migration installs the application-specific policies.
ALTER TABLE storage.objects ENABLE ROW LEVEL SECURITY;

CREATE OR REPLACE FUNCTION storage.foldername(name text)
"""
              if text.count(old) != 1:
                  raise SystemExit(f'expected exactly one storage.objects anchor, found {text.count(old)}')
              path.write_text(text.replace(old, new, 1))
          PY
          dart format test/helpers/postgres_rls_harness.dart
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test/helpers/postgres_rls_harness.dart
          if git diff --cached --quiet; then
            echo "Storage RLS harness fix already present."
          else
            git diff --cached --check
            git commit -m "test: mirror Supabase Storage RLS in PostgreSQL harness"
            git push origin HEAD:agent/ci-diagnostic-20260819
          fi

      - name: Apply and commit canonical Dart formatting
        shell: bash
        run: |
          set -euo pipefail
          dart format lib test
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib test
          if git diff --cached --quiet; then
            echo "Formatting already canonical."
          else
            git commit -m "style: apply canonical Dart formatting"
            git push origin HEAD:agent/ci-diagnostic-20260819
          fi

      - name: Run Planora diagnostic suite
        id: diag
        shell: bash
        run: |
          set +e
          mkdir -p tools/ci_diagnostic_logs
          report="tools/CI_DIAGNOSTIC_RESULT.md"
          : > "$report"
          overall=0

          {
            echo "# Planora CI diagnostic"
            echo
            echo "Commit: $GITHUB_SHA"
            echo "Runner: $RUNNER_OS"
            echo "Flutter requested: 3.44.8 stable"
            echo "PostgreSQL: postgres:16 service on localhost:5432"
            echo "Full test concurrency: 1 (shared PostgreSQL test harness isolation)"
            echo
          } >> "$report"

          run_check() {
            label="$1"
            logfile="$2"
            shift 2
            echo "## $label" >> "$report"
            timeout 20m "$@" > "$logfile" 2>&1
            code=$?
            if [ "$code" -eq 0 ]; then
              echo "Status: PASS" >> "$report"
            else
              echo "Status: FAIL (exit $code)" >> "$report"
              overall=1
            fi
            echo >> "$report"
            echo '```text' >> "$report"
            tail -n 180 "$logfile" >> "$report"
            echo '```' >> "$report"
            echo >> "$report"
          }

          run_check "Flutter version" tools/ci_diagnostic_logs/flutter_version.log flutter --version
          run_check "Resolve dependencies" tools/ci_diagnostic_logs/pub_get.log flutter pub get
          run_check "Generate sources" tools/ci_diagnostic_logs/build_runner.log dart run build_runner build
          run_check "Formatting" tools/ci_diagnostic_logs/format.log dart format --output=none --set-exit-if-changed lib test
          run_check "Static analysis" tools/ci_diagnostic_logs/analyze.log flutter analyze
          run_check "Storage RLS security test" tools/ci_diagnostic_logs/rls.log flutter test test/core/remote/supabase_rls_security_test.dart
          run_check "Flutter test --coverage" tools/ci_diagnostic_logs/flutter_test.log flutter test --coverage --concurrency=1
          run_check "Integration tests" tools/ci_diagnostic_logs/integration.log flutter test test/integration
          run_check "Android debug build" tools/ci_diagnostic_logs/android_debug.log flutter build apk --debug

          echo "## Supabase repository secrets" >> "$report"
          secret_ok=1
          if [ -z "${SUPABASE_URL:-}" ]; then
            echo "NOT_SUPABASE_URL: MISSING" >> "$report"
            secret_ok=0
          elif [[ ! "$SUPABASE_URL" =~ ^https://[^/]+\.supabase\.co/?$ ]]; then
            echo "NOT_SUPABASE_URL: PRESENT BUT INVALID FORMAT" >> "$report"
            secret_ok=0
          else
            echo "NOT_SUPABASE_URL: PRESENT / FORMAT OK" >> "$report"
          fi

          if [ -z "${SUPABASE_PUBLISHABLE_KEY:-}" ]; then
            echo "NOT_SUPABASE_PUBLISHABLE_KEY: MISSING" >> "$report"
            secret_ok=0
          elif [[ "$SUPABASE_PUBLISHABLE_KEY" != sb_publishable_* && "$SUPABASE_PUBLISHABLE_KEY" != eyJ* ]]; then
            echo "NOT_SUPABASE_PUBLISHABLE_KEY: PRESENT BUT INVALID FORMAT" >> "$report"
            secret_ok=0
          else
            echo "NOT_SUPABASE_PUBLISHABLE_KEY: PRESENT / FORMAT OK" >> "$report"
          fi
          echo >> "$report"

          if [ "$secret_ok" -eq 1 ]; then
            run_check "Android release build with Supabase" tools/ci_diagnostic_logs/android_release.log flutter build apk --release --dart-define=APP_ENV=production --dart-define=SUPABASE_URL="$SUPABASE_URL" --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"
          else
            echo "## Android release build with Supabase" >> "$report"
            echo "Status: SKIPPED because required repository secrets are missing or invalid." >> "$report"
            echo >> "$report"
            overall=1
          fi

          if [ "$overall" -eq 0 ]; then
            echo "## Overall" >> "$report"
            echo "PASS" >> "$report"
          else
            echo "## Overall" >> "$report"
            echo "FAIL" >> "$report"
          fi

          echo "overall=$overall" >> "$GITHUB_OUTPUT"

      - name: Publish diagnostic result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_URL: ${{ steps.tracking.outputs.issue_url }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${ISSUE_URL:-}" ] && [ -f tools/CI_DIAGNOSTIC_RESULT.md ]; then
            gh issue comment "$ISSUE_URL" --body-file tools/CI_DIAGNOSTIC_RESULT.md
          fi

      - name: Mark diagnostic failure
        if: steps.diag.outputs.overall != '0'
        run: exit 1
