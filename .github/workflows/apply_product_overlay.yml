name: Apply product source overlay

on:
  push:
    paths:
      - tools/product_overlay.b64

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply prepared product source tree
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode tools/product_overlay.b64 > "$RUNNER_TEMP/product-overlay.tar.gz"
          tar -xzf "$RUNNER_TEMP/product-overlay.tar.gz" -C .
          rm tools/product_overlay.b64
      - name: Commit product implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "phases 2-17: implement offline-first product"
          git push origin HEAD:main
