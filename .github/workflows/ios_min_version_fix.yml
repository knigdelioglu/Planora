name: Raise iOS minimum deployment

on:
  push:
    paths:
      - tools/ios_min_version.trigger

permissions:
  contents: write

jobs:
  update:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Raise deployment target and regenerate Flutter config
        shell: bash
        run: |
          set -euo pipefail
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = 13.0;/IPHONEOS_DEPLOYMENT_TARGET = 14.0;/g' ios/Runner.xcodeproj/project.pbxproj
          flutter pub get
          flutter build ios --config-only
          if grep -n 'IPHONEOS_DEPLOYMENT_TARGET = 13.0' ios/Runner.xcodeproj/project.pbxproj; then
            echo 'iOS 13 deployment target remains in project.' >&2
            exit 1
          fi
      - name: Commit deployment target update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ios
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix(ios): raise minimum deployment target to 14"
          git pull --rebase origin main
          git push origin HEAD:main
