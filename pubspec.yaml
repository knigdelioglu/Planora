name: not_app
description: Single-user, offline-first personal notes and Kanban workspace.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.2
  drift: ^2.32.1
  sqlite3: ^3.5.0
  path_provider: ^2.1.6
  file_picker: 12.0.0-beta.7
  uuid: ^4.6.0
  path: ^1.9.1
  flutter_local_notifications: ^22.2.0
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  supabase_flutter: ^2.16.0
  dio: ^5.11.0
  connectivity_plus: ^7.3.1
  reorderables: ^0.6.0
  crypto: ^3.0.6
  cryptography: ^2.9.0
  flutter_secure_storage: ^10.3.1
  mime: ^2.0.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: 2.15.1
  drift_dev: 2.32.1
  mocktail: ^1.0.4

hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc

flutter:
  uses-material-design: true
