name: not_app
description: Single-user, offline-first Notion-like notes and Kanban client.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.2
  riverpod_annotation: ^4.0.6
  drift: ^2.34.3
  sqlite3: ^3.5.0
  path_provider: ^2.1.6
  file_picker: ^11.0.2
  uuid: ^4.6.0
  path: ^1.9.1
  flutter_local_notifications: ^22.2.0
  timezone: ^0.11.1
  supabase_flutter: ^2.16.0
  dio: ^5.11.0
  connectivity_plus: ^7.3.1
  reorderables: ^0.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.3
  riverpod_generator: ^4.0.8
  drift_dev: ^2.34.5

flutter:
  uses-material-design: true
